<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AniVerse - Tu Portal Anime</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #12111a;
  --bg-card: #1a1825;
  --bg-card-hover: #221f30;
  --bg-overlay: rgba(0,0,0,0.85);
  --accent-primary: #9333ea;
  --accent-secondary: #ec4899;
  --accent-gradient: linear-gradient(135deg, #9333ea, #ec4899);
  --accent-gradient-h: linear-gradient(90deg, #9333ea, #ec4899);
  --text-primary: #f0eef6;
  --text-secondary: #a09aaf;
  --text-muted: #6b6580;
  --border-color: #2a2640;
  --success: #22c55e;
  --warning: #f59e0b;
  --danger: #ef4444;
  --radius: 12px;
  --radius-sm: 8px;
  --radius-lg: 16px;
  --shadow: 0 8px 32px rgba(0,0,0,0.4);
  --shadow-accent: 0 4px 24px rgba(147,51,234,0.3);
  --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

* { margin:0; padding:0; box-sizing:border-box; }

html { scroll-behavior: smooth; }

body {
  font-family: var(--font);
  background: var(--bg-primary);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.6;
}

::-webkit-scrollbar { width:6px; height:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--accent-primary); border-radius:3px; }
::-webkit-scrollbar-thumb:hover { background:var(--accent-secondary); }

a { color:inherit; text-decoration:none; }
button { cursor:pointer; font-family:var(--font); border:none; outline:none; }
img { display:block; }
input { font-family:var(--font); outline:none; }

/* ============ HEADER ============ */
.header {
  position:fixed; top:0; left:0; right:0; z-index:100;
  background:rgba(10,10,15,0.92);
  backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border-color);
  transition:var(--transition);
}
.header.scrolled { background:rgba(10,10,15,0.98); box-shadow:0 2px 20px rgba(0,0,0,0.5); }
.header-inner {
  max-width:1400px; margin:0 auto;
  padding:0 24px; height:64px;
  display:flex; align-items:center; gap:24px;
}
.logo {
  font-size:1.5rem; font-weight:900;
  background:var(--accent-gradient);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text; letter-spacing:-0.5px;
  white-space:nowrap; flex-shrink:0;
}
.logo span { font-weight:400; opacity:0.7; }

.search-container {
  flex:1; max-width:500px; position:relative;
}
.search-input {
  width:100%; padding:10px 16px 10px 44px;
  background:var(--bg-secondary); border:1px solid var(--border-color);
  border-radius:50px; color:var(--text-primary); font-size:0.9rem;
  transition:var(--transition);
}
.search-input::placeholder { color:var(--text-muted); }
.search-input:focus {
  border-color:var(--accent-primary);
  box-shadow:0 0 0 3px rgba(147,51,234,0.15);
}
.search-icon {
  position:absolute; left:14px; top:50%; transform:translateY(-50%);
  color:var(--text-muted); pointer-events:none;
}
.search-results {
  position:absolute; top:calc(100% + 8px); left:0; right:0;
  background:var(--bg-card); border:1px solid var(--border-color);
  border-radius:var(--radius); overflow:hidden;
  box-shadow:var(--shadow); display:none; max-height:420px; overflow-y:auto;
  z-index:200;
}
.search-results.active { display:block; }
.search-result-item {
  display:flex; align-items:center; gap:12px; padding:10px 16px;
  cursor:pointer; transition:var(--transition);
}
.search-result-item:hover { background:var(--bg-card-hover); }
.search-result-item img {
  width:45px; height:64px; object-fit:cover; border-radius:6px; flex-shrink:0;
}
.search-result-info h4 { font-size:0.85rem; font-weight:600; line-height:1.3; }
.search-result-info p { font-size:0.75rem; color:var(--text-secondary); }

.nav-links {
  display:flex; gap:8px; flex-shrink:0;
}
.nav-link {
  padding:8px 16px; border-radius:50px;
  font-size:0.85rem; font-weight:500;
  color:var(--text-secondary); background:transparent;
  transition:var(--transition);
}
.nav-link:hover, .nav-link.active {
  color:var(--text-primary); background:var(--bg-card);
}

/* ============ HERO CAROUSEL ============ */
.hero {
  margin-top:64px; position:relative; height:520px; overflow:hidden;
}
.hero-slide {
  position:absolute; inset:0; opacity:0;
  transition:opacity 0.8s ease;
}
.hero-slide.active { opacity:1; }
.hero-bg {
  position:absolute; inset:0;
  background-size:cover; background-position:center top;
  filter:blur(2px) brightness(0.35); transform:scale(1.05);
}
.hero-gradient {
  position:absolute; inset:0;
  background:linear-gradient(to top, var(--bg-primary) 0%, transparent 50%),
             linear-gradient(to right, rgba(10,10,15,0.9) 30%, transparent 70%);
}
.hero-content {
  position:relative; z-index:2; height:100%;
  display:flex; flex-direction:column; justify-content:flex-end;
  padding:0 60px 60px; max-width:1400px; margin:0 auto;
}
.hero-badge {
  display:inline-flex; align-items:center; gap:6px;
  padding:4px 12px; border-radius:50px;
  background:var(--accent-gradient); font-size:0.75rem;
  font-weight:600; margin-bottom:12px; width:fit-content;
}
.hero-title {
  font-size:3rem; font-weight:900; line-height:1.1;
  margin-bottom:12px; max-width:600px;
}
.hero-meta {
  display:flex; align-items:center; gap:16px;
  margin-bottom:16px; flex-wrap:wrap;
}
.hero-meta-item {
  display:flex; align-items:center; gap:4px;
  font-size:0.85rem; color:var(--text-secondary);
}
.hero-meta-item svg { width:16px; height:16px; }
.hero-score {
  color:var(--warning); font-weight:700;
}
.hero-desc {
  font-size:0.9rem; color:var(--text-secondary);
  max-width:500px; line-height:1.6; margin-bottom:20px;
  display:-webkit-box; -webkit-line-clamp:3;
  -webkit-box-orient:vertical; overflow:hidden;
}
.hero-actions { display:flex; gap:12px; }
.btn {
  display:inline-flex; align-items:center; gap:8px;
  padding:12px 28px; border-radius:50px; font-weight:600;
  font-size:0.9rem; transition:var(--transition);
}
.btn-primary {
  background:var(--accent-gradient); color:white;
  box-shadow:var(--shadow-accent);
}
.btn-primary:hover { transform:translateY(-2px); box-shadow:0 6px 30px rgba(147,51,234,0.5); }
.btn-secondary {
  background:rgba(255,255,255,0.1); color:var(--text-primary);
  backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.15);
}
.btn-secondary:hover { background:rgba(255,255,255,0.2); }

.hero-dots {
  position:absolute; bottom:24px; right:60px; z-index:3;
  display:flex; gap:8px;
}
.hero-dot {
  width:8px; height:8px; border-radius:50%;
  background:rgba(255,255,255,0.3); transition:var(--transition);
  cursor:pointer;
}
.hero-dot.active {
  width:32px; border-radius:4px;
  background:var(--accent-gradient);
}

/* ============ CONTENT ROWS ============ */
.content-section {
  padding:32px 0; position:relative;
}
.content-section:first-of-type { padding-top:40px; }
.section-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:0 60px; margin-bottom:20px; max-width:1400px; margin-left:auto; margin-right:auto;
}
.section-title {
  font-size:1.4rem; font-weight:800;
  display:flex; align-items:center; gap:10px;
}
.section-title::before {
  content:''; width:4px; height:24px;
  background:var(--accent-gradient); border-radius:2px;
}
.section-more {
  font-size:0.85rem; color:var(--accent-primary);
  font-weight:600; transition:var(--transition);
}
.section-more:hover { color:var(--accent-secondary); }

.scroll-row {
  display:flex; gap:16px; overflow-x:auto;
  padding:0 60px 16px; scroll-behavior:smooth;
  -ms-overflow-style:none; scrollbar-width:none;
}
.scroll-row::-webkit-scrollbar { display:none; }

.anime-card {
  flex:0 0 185px; cursor:pointer; transition:var(--transition);
  position:relative;
}
.anime-card:hover { transform:translateY(-8px); }
.anime-card-img {
  width:185px; height:265px; border-radius:var(--radius);
  overflow:hidden; position:relative; background:var(--bg-card);
}
.anime-card-img img {
  width:100%; height:100%; object-fit:cover;
  transition:transform 0.5s ease;
}
.anime-card:hover .anime-card-img img { transform:scale(1.08); }
.anime-card-overlay {
  position:absolute; inset:0;
  background:linear-gradient(to top, rgba(0,0,0,0.8) 0%, transparent 50%);
  opacity:0; transition:var(--transition);
  display:flex; align-items:center; justify-content:center;
}
.anime-card:hover .anime-card-overlay { opacity:1; }
.play-icon {
  width:50px; height:50px; border-radius:50%;
  background:var(--accent-gradient); display:flex;
  align-items:center; justify-content:center;
  box-shadow:var(--shadow-accent);
  transform:scale(0.8); transition:var(--transition);
}
.anime-card:hover .play-icon { transform:scale(1); }
.anime-card-badge {
  position:absolute; top:8px; left:8px;
  padding:2px 8px; border-radius:4px;
  font-size:0.65rem; font-weight:700;
  background:var(--accent-gradient); z-index:2;
}
.anime-card-score {
  position:absolute; top:8px; right:8px;
  padding:2px 8px; border-radius:4px;
  font-size:0.7rem; font-weight:700;
  background:rgba(0,0,0,0.7); backdrop-filter:blur(4px);
  display:flex; align-items:center; gap:3px;
  color:var(--warning); z-index:2;
}
.anime-card-title {
  margin-top:8px; font-size:0.82rem; font-weight:600;
  line-height:1.3; display:-webkit-box;
  -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.anime-card-sub {
  font-size:0.72rem; color:var(--text-muted); margin-top:2px;
}

/* ============ MODAL ============ */
.modal-overlay {
  position:fixed; inset:0; z-index:500;
  background:var(--bg-overlay); backdrop-filter:blur(8px);
  display:none; align-items:flex-start; justify-content:center;
  overflow-y:auto; padding:40px 20px;
}
.modal-overlay.active { display:flex; }

.modal {
  width:100%; max-width:900px;
  background:var(--bg-secondary); border-radius:var(--radius-lg);
  overflow:hidden; position:relative;
  animation:modalIn 0.3s ease;
}
@keyframes modalIn {
  from { opacity:0; transform:translateY(20px) scale(0.97); }
  to { opacity:1; transform:translateY(0) scale(1); }
}

.modal-close {
  position:absolute; top:16px; right:16px; z-index:10;
  width:40px; height:40px; border-radius:50%;
  background:rgba(0,0,0,0.6); backdrop-filter:blur(10px);
  color:white; display:flex; align-items:center; justify-content:center;
  transition:var(--transition);
}
.modal-close:hover { background:rgba(255,255,255,0.2); }

.modal-banner {
  position:relative; height:300px; overflow:hidden;
}
.modal-banner img {
  width:100%; height:100%; object-fit:cover;
  filter:brightness(0.5);
}
.modal-banner-gradient {
  position:absolute; inset:0;
  background:linear-gradient(to top, var(--bg-secondary) 0%, transparent 60%);
}

.modal-body { padding:0 32px 32px; margin-top:-80px; position:relative; z-index:2; }

.modal-top { display:flex; gap:24px; margin-bottom:24px; }
.modal-poster {
  width:180px; flex-shrink:0; margin-top:-40px;
}
.modal-poster img {
  width:100%; border-radius:var(--radius);
  box-shadow:0 8px 32px rgba(0,0,0,0.5);
}
.modal-info { flex:1; padding-top:8px; }
.modal-title { font-size:1.8rem; font-weight:900; line-height:1.2; margin-bottom:8px; }
.modal-meta {
  display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px;
}
.modal-meta-tag {
  padding:4px 10px; border-radius:50px; font-size:0.75rem;
  font-weight:600; background:var(--bg-card); border:1px solid var(--border-color);
}
.modal-meta-tag.score { background:var(--accent-gradient); border-color:transparent; }
.modal-synopsis {
  font-size:0.88rem; color:var(--text-secondary); line-height:1.7;
  max-height:120px; overflow-y:auto; margin-bottom:16px;
}

.modal-info-row {
  display:flex; gap:24px; margin-bottom:8px; font-size:0.85rem;
}
.modal-info-label { color:var(--text-muted); font-weight:500; min-width:100px; }
.modal-info-value { color:var(--text-primary); }

/* Episodes section */
.episodes-section { margin-top:24px; }
.episodes-header {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:16px;
}
.episodes-title {
  font-size:1.1rem; font-weight:700;
  display:flex; align-items:center; gap:8px;
}
.lang-toggle {
  display:flex; background:var(--bg-card); border-radius:50px;
  overflow:hidden; border:1px solid var(--border-color);
}
.lang-btn {
  padding:6px 16px; font-size:0.78rem; font-weight:600;
  color:var(--text-muted); background:transparent;
  transition:var(--transition);
}
.lang-btn.active {
  background:var(--accent-gradient); color:white;
}

.episodes-grid {
  display:grid; grid-template-columns:repeat(auto-fill, minmax(80px, 1fr));
  gap:8px; max-height:280px; overflow-y:auto;
  padding-right:4px;
}
.episode-btn {
  padding:10px 4px; text-align:center;
  background:var(--bg-card); border:1px solid var(--border-color);
  border-radius:var(--radius-sm); font-size:0.8rem; font-weight:600;
  color:var(--text-primary); transition:var(--transition);
}
.episode-btn:hover {
  border-color:var(--accent-primary); background:var(--bg-card-hover);
}
.episode-btn.active {
  background:var(--accent-gradient); border-color:transparent;
}

.episodes-loading {
  display:flex; align-items:center; justify-content:center;
  padding:40px; color:var(--text-muted);
}

.no-episodes {
  text-align:center; padding:24px; color:var(--text-muted);
  font-size:0.9rem;
}

/* ============ VIDEO MODAL ============ */
.video-modal {
  width:100%; max-width:1000px;
  background:var(--bg-secondary); border-radius:var(--radius-lg);
  overflow:hidden; animation:modalIn 0.3s ease;
}
.video-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:16px 24px; border-bottom:1px solid var(--border-color);
}
.video-title { font-size:1rem; font-weight:700; }
.video-close {
  width:36px; height:36px; border-radius:50%;
  background:var(--bg-card); color:var(--text-primary);
  display:flex; align-items:center; justify-content:center;
  transition:var(--transition);
}
.video-close:hover { background:var(--bg-card-hover); }

.video-wrapper {
  position:relative; width:100%;
  background:#000; aspect-ratio:16/9;
}
.video-wrapper iframe {
  width:100%; height:100%; border:none;
}

.video-servers {
  padding:16px 24px; border-top:1px solid var(--border-color);
}
.servers-label {
  font-size:0.8rem; font-weight:600; color:var(--text-muted);
  margin-bottom:8px; text-transform:uppercase; letter-spacing:0.5px;
}
.servers-list { display:flex; flex-wrap:wrap; gap:8px; }
.server-btn {
  padding:8px 16px; border-radius:var(--radius-sm);
  background:var(--bg-card); border:1px solid var(--border-color);
  color:var(--text-secondary); font-size:0.8rem; font-weight:600;
  transition:var(--transition);
}
.server-btn:hover { border-color:var(--accent-primary); color:var(--text-primary); }
.server-btn.active {
  background:var(--accent-gradient); border-color:transparent; color:white;
}

.video-lang-toggle {
  display:flex; background:var(--bg-card); border-radius:50px;
  overflow:hidden; border:1px solid var(--border-color);
}
.video-lang-btn {
  padding:6px 14px; font-size:0.75rem; font-weight:600;
  color:var(--text-muted); background:transparent;
  transition:var(--transition);
}
.video-lang-btn.active {
  background:var(--accent-gradient); color:white;
}

/* ============ LOADING ============ */
.spinner {
  width:40px; height:40px; border:3px solid var(--border-color);
  border-top-color:var(--accent-primary); border-radius:50%;
  animation:spin 0.8s linear infinite;
}
@keyframes spin { to { transform:rotate(360deg); } }

.loading-screen {
  display:flex; flex-direction:column; align-items:center;
  justify-content:center; min-height:300px; gap:16px;
}
.loading-screen p { color:var(--text-muted); font-size:0.9rem; }

.skeleton {
  background:linear-gradient(90deg, var(--bg-card) 25%, var(--bg-card-hover) 50%, var(--bg-card) 75%);
  background-size:200% 100%;
  animation:shimmer 1.5s infinite;
  border-radius:var(--radius);
}
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

.hero-skeleton { width:100%; height:520px; }

/* ============ FOOTER ============ */
.footer {
  margin-top:60px; padding:40px 60px;
  border-top:1px solid var(--border-color);
  background:var(--bg-secondary);
}
.footer-inner {
  max-width:1400px; margin:0 auto;
  display:flex; align-items:center; justify-content:space-between;
  flex-wrap:wrap; gap:16px;
}
.footer-brand {
  font-size:1.2rem; font-weight:800;
  background:var(--accent-gradient);
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
}
.footer-text { font-size:0.8rem; color:var(--text-muted); }
.footer-links { display:flex; gap:16px; }
.footer-link {
  font-size:0.8rem; color:var(--text-secondary);
  transition:var(--transition);
}
.footer-link:hover { color:var(--accent-primary); }

/* ============ TOAST ============ */
.toast-container {
  position:fixed; top:80px; right:20px; z-index:1000;
  display:flex; flex-direction:column; gap:8px;
}
.toast {
  padding:12px 20px; border-radius:var(--radius-sm);
  background:var(--bg-card); border:1px solid var(--border-color);
  color:var(--text-primary); font-size:0.85rem;
  box-shadow:var(--shadow); animation:toastIn 0.3s ease;
  display:flex; align-items:center; gap:8px;
}
.toast.error { border-color:var(--danger); }
@keyframes toastIn {
  from { opacity:0; transform:translateX(20px); }
  to { opacity:1; transform:translateX(0); }
}

/* ============ RESPONSIVE ============ */
@media (max-width:1024px) {
  .hero { height:420px; }
  .hero-content { padding:0 32px 40px; }
  .hero-title { font-size:2.2rem; }
  .section-header { padding:0 32px; }
  .scroll-row { padding:0 32px 16px; }
  .footer { padding:32px; }
}
@media (max-width:768px) {
  .header-inner { padding:0 16px; gap:12px; }
  .nav-links { display:none; }
  .search-container { max-width:none; }
  .hero { height:360px; }
  .hero-content { padding:0 20px 30px; }
  .hero-title { font-size:1.6rem; }
  .hero-desc { -webkit-line-clamp:2; font-size:0.82rem; }
  .hero-actions { flex-wrap:wrap; }
  .btn { padding:10px 20px; font-size:0.82rem; }
  .hero-dots { right:20px; bottom:16px; }
  .section-header { padding:0 20px; }
  .section-title { font-size:1.15rem; }
  .scroll-row { padding:0 20px 16px; gap:12px; }
  .anime-card { flex:0 0 140px; }
  .anime-card-img { width:140px; height:200px; }
  .footer { padding:24px 20px; }
  .modal-body { padding:0 20px 20px; }
  .modal-top { flex-direction:column; align-items:center; text-align:center; }
  .modal-poster { width:140px; margin-top:-40px; }
  .modal-meta { justify-content:center; }
  .modal-banner { height:200px; }
  .episodes-grid { grid-template-columns:repeat(auto-fill, minmax(60px, 1fr)); }
}
@media (max-width:480px) {
  .hero { height:320px; }
  .hero-title { font-size:1.3rem; }
  .anime-card { flex:0 0 120px; }
  .anime-card-img { width:120px; height:170px; }
  .anime-card-title { font-size:0.75rem; }
}
</style>
</head>
<body>

<!-- HEADER -->
<header class="header" id="header">
  <div class="header-inner">
    <a href="#" class="logo" onclick="goHome()">Ani<span>Verse</span></a>
    <div class="search-container" id="searchContainer">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" class="search-input" id="searchInput" placeholder="Buscar anime..." autocomplete="off">
      <div class="search-results" id="searchResults"></div>
    </div>
    <nav class="nav-links">
      <button class="nav-link active">Inicio</button>
      <button class="nav-link" onclick="loadPage('airing')">En Emisión</button>
      <button class="nav-link" onclick="loadPage('popular')">Populares</button>
    </nav>
  </div>
</header>

<!-- HERO CAROUSEL -->
<section class="hero" id="heroSection">
  <div id="heroSlides"></div>

<script>

const JIKAN_BASE = 'https://api.jikan.moe/v4';
const ANIME_API_BASE = 'https://anime1v-api-cloned.onrender.com';
const ANIME_API_KEY = '86d6451302f2150096aa561c7311ed6f';

// ===================== STATE =====================
let heroSlides = [];
let currentHeroSlide = 0;
let heroInterval = null;
let searchTimeout = null;
let selectedLang = 'SUB';
let currentAnime1Results = null;
let currentEpisodeServers = null;
let jikanQueue = [];
let jikanProcessing = false;
let lastJikanRequest = 0;

// ===================== JIKAN RATE LIMITER =====================
const JIKAN_MIN_INTERVAL = 350; // ms between requests (~2.85/sec)

function jikanFetch(url) {
  return new Promise((resolve, reject) => {
    jikanQueue.push({ url, resolve, reject });
    processJikanQueue();
  });
}

async function processJikanQueue() {
  if (jikanProcessing || jikanQueue.length === 0) return;
  jikanProcessing = true;

  while (jikanQueue.length > 0) {
    const now = Date.now();
    const elapsed = now - lastJikanRequest;
    if (elapsed < JIKAN_MIN_INTERVAL) {
      await sleep(JIKAN_MIN_INTERVAL - elapsed);
    }
    const { url, resolve, reject } = jikanQueue.shift();
    lastJikanRequest = Date.now();
    try {
      const res = await fetch(url);
      if (res.status === 429) {
        // Rate limited, wait and retry
        await sleep(1000);
        jikanQueue.unshift({ url, resolve, reject });
        continue;
      }
      const data = await res.json();
      resolve(data);
    } catch (err) {
      reject(err);
    }
  }
  jikanProcessing = false;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// ===================== ANIME1 API =====================
async function anime1Search(query) {
  try {
    const res = await fetch(`${ANIME_API_BASE}/api/v1/anime/search?q=${encodeURIComponent(query)}&apiKey=${ANIME_API_KEY}`);
    return await res.json();
  } catch (e) {
    console.error('anime1 search error:', e);
    return null;
  }
}

async function anime1Info(url) {
  try {
    const res = await fetch(`${ANIME_API_BASE}/api/v1/anime/info?url=${encodeURIComponent(url)}&apiKey=${ANIME_API_KEY}`);
    return await res.json();
  } catch (e) {
    console.error('anime1 info error:', e);
    return null;
  }
}

async function anime1Episode(url) {
  try {
    const res = await fetch(`${ANIME_API_BASE}/api/v1/anime/episode?url=${encodeURIComponent(url)}&apiKey=${ANIME_API_KEY}`);
    return await res.json();

  }
}

// ===================== TOAST =====================
function showToast(msg, type = 'info') {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `
    ${type === 'error' ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>' : ''}
    ${msg}
  `;
  container.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
}

function goToSlide(index) {
  const slides = document.querySelectorAll('.hero-slide');
  const dots = document.querySelectorAll('.hero-dot');
  slides.forEach(s => s.classList.remove('active'));
  dots.forEach(d => d.classList.remove('active'));
  currentHeroSlide = index;
  slides[index]?.classList.add('active');
  dots[index]?.classList.add('active');
}

function nextSlide() {
  const next = (currentHeroSlide + 1) % heroSlides.length;
  goToSlide(next);
}

function startHeroAutoplay() {
  clearInterval(heroInterval);
  heroInterval = setInterval(nextSlide, 6000);
}

// ===================== SEARCH =====================
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');

searchInput.addEventListener('input', (e) => {
  clearTimeout(searchTimeout);
  const q = e.target.value.trim();
  if (q.length < 2) {
    searchResults.classList.remove('active');
    searchResults.innerHTML = '';
    return;
  }
  searchTimeout = setTimeout(() => doSearch(q), 500);
});

// Close search results on outside click
document.addEventListener('click', (e) => {
  if (!document.getElementById('searchContainer').contains(e.target)) {
    searchResults.classList.remove('active');
  }
});

async function doSearch(query) {
  searchResults.innerHTML = '<div class="loading-screen" style="padding:16px"><div class="spinner" style="width:24px;height:24px;border-width:2px"></div></div>';
  searchResults.classList.add('active');
  try {
    const data = await jikanFetch(`${JIKAN_BASE}/anime?q=${encodeURIComponent(query)}&limit=12`);
    if (data.data && data.data.length > 0) {
      searchResults.innerHTML = data.data.map(a => `
        <div class="search-result-item" onclick="openDetail(${a.mal_id})">
          <img src="${a.images?.jpg?.image_url || ''}" alt="${a.title}" loading="lazy">
          <div class="search-result-info">
            <h4>${a.title}</h4>
            <p>${a.type || 'N/A'} · ${a.score ? a.score.toFixed(1) : 'N/A'} · ${a.episodes || '?'} eps</p>
          </div>
        </div>
      `).join('');
    } else {
      searchResults.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted)">No se encontraron resultados</div>';
    }
  } catch (e) {
    searchResults.innerHTML = '<div style="padding:20px;text-align:center;color:var(--danger)">Error en la búsqueda</div>';
  }
}

async function loadEpisodes(title) {
  const episodesContent = document.getElementById('episodesContent');
  if (!episodesContent) return;

  try {
    const searchResult = await anime1Search(title);
    if (!searchResult?.success || !searchResult.data?.results?.length) {
      episodesContent.innerHTML = '<div class="no-episodes">No se encontraron episodios disponibles para este anime.</div>';
      return;
    }

    currentAnime1Results = searchResult.data.results;

    // Try to find best match
    const bestMatch = findBestMatch(title, currentAnime1Results);

    if (!bestMatch) {
      episodesContent.innerHTML = '<div class="no-episodes">No se encontró una coincidencia para este anime.</div>';
      return;
    }

    const infoResult = await anime1Info(bestMatch.url);
    if (!infoResult?.success || !infoResult.data?.episodes?.length) {
      episodesContent.innerHTML = '<div class="no-episodes">No hay episodios disponibles.</div>';
      return;
    }

    const episodes = infoResult.data.episodes;
    const animeInfo = infoResult.data;
    window._currentAnimeInfo = animeInfo;
    window._currentAnimeUrl = bestMatch.url;

    episodesContent.innerHTML = `
      <div class="episodes-grid">
        ${episodes.map((ep, i) => `
          <button class="episode-btn" onclick="openEpisode(${i})" title="Episodio ${ep.number || i+1}">
            ${ep.number || i + 1}
          </button>
        `).join('')}
      </div>
    `;

  } catch (e) {
    console.error('Episodes error:', e);
    episodesContent.innerHTML = '<div class="no-episodes">Error al cargar los episodios.</div>';
  }
}

function findBestMatch(title, results) {
  if (!results || results.length === 0) return null;

  const cleanTitle = title.toLowerCase()
    .replace(/[^\w\s]/g, '')
    .replace(/\s+/g, ' ')
    .trim();

  // Exact match
  const exact = results.find(r => r.title.toLowerCase().replace(/[^\w\s]/g, '').replace(/\s+/g, ' ').trim() === cleanTitle);
  if (exact) return exact;

  // Contains match
  const contains = results.find(r => {
    const rTitle = r.title.toLowerCase().replace(/[^\w\s]/g, '').replace(/\s+/g, ' ').trim();
    return rTitle.includes(cleanTitle) || cleanTitle.includes(rTitle);
  });
  if (contains) return contains;

  // Word overlap
  const titleWords = cleanTitle.split(' ').filter(w => w.length > 2);
  let bestScore = 0;
  let bestResult = results[0];
  results.forEach(r => {
    const rTitle = r.title.toLowerCase().replace(/[^\w\s]/g, '').replace(/\s+/g, ' ').trim();
    const rWords = rTitle.split(' ').filter(w => w.length > 2);
    const overlap = titleWords.filter(w => rWords.some(rw => rw.includes(w) || w.includes(rw))).length;
    const score = overlap / Math.max(titleWords.length, 1);
    if (score > bestScore) { bestScore = score; bestResult = r; }
  });

  return bestResult;
}

function switchLang(lang) {
  selectedLang = lang;
  document.querySelectorAll('.lang-btn').forEach(b => {
    b.classList.toggle('active', b.textContent === lang);
  });
}

// ===================== VIDEO PLAYER =====================
async function openEpisode(episodeIndex) {
  const animeInfo = window._currentAnimeInfo;
  const animeUrl = window._currentAnimeUrl;
  if (!animeInfo?.episodes?.[episodeIndex]) return;

  const ep = animeInfo.episodes[episodeIndex];
  const videoModal = document.getElementById('videoModal');
  const videoContent = document.getElementById('videoModalContent');

  videoModal.classList.add('active');
  document.body.style.overflow = 'hidden';

  videoContent.innerHTML = `
    <div class="video-header">
      <h3 class="video-title">${animeInfo.title} - Episodio ${ep.number || episodeIndex + 1}</h3>
      <button class="video-close" onclick="closeVideo()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="video-wrapper">
      <div class="loading-screen"><div class="spinner"></div><p>Cargando servidor...</p></div>
    </div>
    <div class="video-servers">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        <span class="servers-label">Servidores</span>
        <div class="video-lang-toggle">
          <button class="video-lang-btn ${selectedLang === 'SUB' ? 'active' : ''}" onclick="switchVideoLang('SUB')">SUB</button>
          <button class="video-lang-btn ${selectedLang === 'DUB' ? 'active' : ''}" onclick="switchVideoLang('DUB')">DUB</button>
        </div>
      </div>
      <div class="servers-list" id="serverList">
        <div class="spinner" style="width:20px;height:20px;border-width:2px"></div>
      </div>
    </div>
  `;

  try {
    const epResult = await anime1Episode(ep.url);
    if (!epResult?.success) {
      videoContent.querySelector('.video-wrapper').innerHTML = '<div class="loading-screen"><p style="color:var(--danger)">Error al cargar el episodio</p></div>';
      return;
    }

    currentEpisodeServers = epResult.data;
    renderServersAndPlay();

  } catch (e) {
    console.error('Episode error:', e);
    videoContent.querySelector('.video-wrapper').innerHTML = '<div class="loading-screen"><p style="color:var(--danger)">Error al cargar el episodio</p></div>';
  }
}

function renderServersAndPlay() {
  if (!currentEpisodeServers) return;

  const serverList = document.getElementById('serverList');
  const wrapper = document.querySelector('.video-wrapper');

  // Get servers based on selected language
  let servers = [];
  const lang = selectedLang;

  // Try streamLinks first (more reliable)
  if (currentEpisodeServers.streamLinks) {
    const streamKey = lang === 'DUB' ? 'DUB' : 'SUB';
    const streamServers = currentEpisodeServers.streamLinks[streamKey] || [];
    servers = streamServers.map(s => ({ server: s.server, url: s.url, type: lang }));
  }

  // Fallback to servers object
  if (servers.length === 0 && currentEpisodeServers.servers) {
    const serverKey = lang === 'DUB' ? 'dub' : 'sub';
    const serverList2 = currentEpisodeServers.servers[serverKey] || [];
    servers = serverList2.map(s => ({ server: s.server, url: s.url, type: lang }));
  }

  // Try opposite language as fallback
  if (servers.length === 0) {
    if (currentEpisodeServers.streamLinks) {
      const altKey = lang === 'DUB' ? 'SUB' : 'DUB';
      const altServers = currentEpisodeServers.streamLinks[altKey] || [];
      servers = altServers.map(s => ({ server: s.server + ` (${altKey})`, url: s.url, type: altKey }));
    }
    if (servers.length === 0 && currentEpisodeServers.servers) {
      const altKey2 = lang === 'DUB' ? 'sub' : 'dub';
      const altServers2 = currentEpisodeServers.servers[altKey2] || [];
      servers = altServers2.map(s => ({ server: s.server + ` (${altKey2.toUpperCase()})`, url: s.url, type: altKey2 }));
    }
  }

  if (servers.length === 0) {
    serverList.innerHTML = '<span style="color:var(--text-muted);font-size:0.85rem">No hay servidores disponibles</span>';
    wrapper.innerHTML = '<div class="loading-screen"><p style="color:var(--text-muted)">No hay servidores disponibles para este idioma</p></div>';
    return;
  }

  // Render server buttons
  serverList.innerHTML = servers.map((s, i) => `
    <button class="server-btn ${i === 0 ? 'active' : ''}" onclick="selectServer(${i})">${s.server}</button>
  `).join('');

  // Play first server
  playServer(servers[0].url);
  window._currentServers = servers;
}

function selectServer(index) {
  const servers = window._currentServers;
  if (!servers?.[index]) return;
  document.querySelectorAll('.server-btn').forEach((b, i) => b.classList.toggle('active', i === index));
  playServer(servers[index].url);
}

function playServer(url) {
  const wrapper = document.querySelector('.video-wrapper');
  if (!wrapper) return;

  // Handle different URL formats
  let embedUrl = url;

  // If it's an HLS stream URL (m3u8), we need a player
  if (url && url.includes('.m3u8')) {
    // Use hls.js or a simple player approach
    wrapper.innerHTML = `
      <video id="videoPlayer" controls autoplay style="width:100%;height:100%;background:#000"></video>
    `;
    const video = document.getElementById('videoPlayer');
    if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = url;
    } else {
      // Load HLS.js dynamically
      loadHlsJs(url, video);
    }
    return;
  }

  // For embed URLs, use iframe
  if (url) {
    wrapper.innerHTML = `<iframe src="${url}" allowfullscreen allow="autoplay; encrypted-media; picture-in-picture" style="width:100%;height:100%;border:none"></iframe>`;
  } else {
    wrapper.innerHTML = '<div class="loading-screen"><p style="color:var(--text-muted)">URL no disponible</p></div>';
  }
}

function loadHlsJs(url, video) {
  const script = document.createElement('script');
  script.src = 'https://cdn.jsdelivr.net/npm/hls.js@latest';
  script.onload = () => {
    if (typeof Hls !== 'undefined' && Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => { video.play(); });
      hls.on(Hls.Events.ERROR, (event, data) => {
        console.error('HLS error:', data);
      });
    } else {
      // Fallback
      video.src = url;
    }
  };
  script.onerror = () => {
    video.src = url;
  };
  document.head.appendChild(script);
}

function switchVideoLang(lang) {
  selectedLang = lang;
  document.querySelectorAll('.video-lang-btn').forEach(b => {
    b.classList.toggle('active', b.textContent === lang);
  });
  renderServersAndPlay();
}

// ===================== MODAL CONTROLS =====================
function closeDetail() {
  document.getElementById('detailModal').classList.remove('active');
  document.body.style.overflow = '';
}

function closeVideo() {
  document.getElementById('videoModal').classList.remove('active');
  const wrapper = document.querySelector('.video-wrapper');
  if (wrapper) wrapper.innerHTML = '';
  document.body.style.overflow = '';
  // Keep detail modal open underneath
  if (!document.getElementById('detailModal').classList.contains('active')) {
    document.body.style.overflow = '';
  }
}

// Close modals on overlay click
document.getElementById('detailModal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('detailModal')) closeDetail();
});
document.getElementById('videoModal').addEventListener('click', (e) => {
  if (e.target === document.getElementById('videoModal')) closeVideo();
});

// Close on Escape
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (document.getElementById('videoModal').classList.contains('active')) closeVideo();
    else if (document.getElementById('detailModal').classList.contains('active')) closeDetail();
  }
});

// ===================== HEADER SCROLL =====================
window.addEventListener('scroll', () => {
  document.getElementById('header').classList.toggle('scrolled', window.scrollY > 50);
});

// ===================== PAGE LOADING =====================
function goHome() {
  searchInput.value = '';
  searchResults.classList.remove('active');
  loadHomePage();
}

async function loadPage(type) {
  document.querySelectorAll('.nav-link').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  const main = document.getElementById('mainContent');
  main.innerHTML = '<div class="loading-screen" style="min-height:400px"><div class="spinner"></div><p>Cargando...</p></div>';

  try {
    let data;
    let title;
    if (type === 'airing') {
      data = await jikanFetch(`${JIKAN_BASE}/anime?limit=25&type=tv&status=airing&order_by=score&sort=desc`);
      title = 'En Emisión';
    } else if (type === 'popular') {
      data = await jikanFetch(`${JIKAN_BASE}/anime?limit=25&order_by=popularity&sort=asc`);
      title = 'Populares';
    }
    if (data?.data) {
      const section = createSection(title, data.data);
      main.innerHTML = '';
      main.appendChild(section);
    }
  } catch (e) {
    main.innerHTML = '<div class="loading-screen"><p style="color:var(--danger)">Error al cargar los datos</p></div>';
  }
}

async function loadHomePage() {
  const main = document.getElementById('mainContent');
  main.innerHTML = '';

  // Show skeletons
  const skeletonSections = ['En Emisión', 'Tendencias', 'Populares', 'Mejor Valorados'];
  skeletonSections.forEach(title => {
    const section = document.createElement('section');
    section.className = 'content-section';
    section.innerHTML = `
      <div class="section-header">
        <h2 class="section-title">${title}</h2>
      </div>
      <div class="scroll-row">
        ${Array(8).fill('').map(() => `
          <div class="anime-card" style="pointer-events:none">
            <div class="anime-card-img skeleton" style="width:185px;height:265px"></div>
            <div class="skeleton" style="width:80%;height:14px;margin-top:8px;border-radius:4px"></div>
            <div class="skeleton" style="width:50%;height:10px;margin-top:4px;border-radius:4px"></div>
          </div>
        `).join('')}
      </div>
    `;
    main.appendChild(section);
  });

  try {
    // Load all sections in parallel (with rate limiting handled by queue)
    const [topData, airingData, seasonData, popularData] = await Promise.all([
      jikanFetch(`${JIKAN_BASE}/top/anime?limit=25`),
      jikanFetch(`${JIKAN_BASE}/anime?limit=25&type=tv&status=airing&order_by=score&sort=desc`),
      jikanFetch(`${JIKAN_BASE}/seasons/now?limit=25`),
      jikanFetch(`${JIKAN_BASE}/anime?limit=25&order_by=popularity&sort=asc`),
    ]);

    // Init hero with top anime
    if (topData?.data) {
      initHero(topData.data);
    }

    // Build sections
    main.innerHTML = '';

    if (airingData?.data) {
      main.appendChild(createSection('En Emisión', airingData.data));
    }
    if (seasonData?.data) {
      main.appendChild(createSection('Tendencias', seasonData.data));
    }
    if (popularData?.data) {
      main.appendChild(createSection('Populares', popularData.data));
    }
    if (topData?.data) {
      // Top rated (by score)
      const topRated = [...topData.data].sort((a, b) => (b.score || 0) - (a.score || 0));
      main.appendChild(createSection('Mejor Valorados', topRated));
    }

  } catch (e) {
    console.error('Load error:', e);
    main.innerHTML = '<div class="loading-screen"><p style="color:var(--danger)">Error al cargar los datos. Recarga la página.</p></div>';
    showToast('Error al cargar los datos', 'error');
  }
}

// ===================== INIT =====================
document.addEventListener('DOMContentLoaded', loadHomePage);
</script>
